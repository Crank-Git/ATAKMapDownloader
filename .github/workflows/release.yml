# FR-foundation-21: a pushed v* tag runs GoReleaser.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  # GoReleaser creates the GitHub Release and uploads the assets.
  contents: write
  # GoReleaser pushes the image to ghcr.io.
  packages: write
  # Cosign keyless signatures need the workflow OIDC token.
  id-token: write
  # The provenance step stores an attestation for the archives.
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the previous tag to write the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The QEMU emulator builds the linux/arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ./dist/checksums.txt
